            type: object
        "403":
          description: 'error: Only parent users can delete child accounts | You can
            only delete your own child users'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Child user not found'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to delete child user'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Delete a sub-account
      tags:
      - users
  /api/v1/users/subaccounts/password:
    put:
      consumes:
      - application/json
      description: Parent users only, for their own sub-accounts.
      parameters:
      - description: Sub-account and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateChildPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Child user password updated successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid request'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: User not authenticated'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Only parent users can update child passwords | You
            can only update passwords for your own child users'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Child user not found'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to update password'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Change a sub-account's password
      tags:
      - users
  /api/v1/users/targets:
    put:
      consumes:
      - application/json
      description: Sets where notifications are delivered. type is 0 none (removes
        the target), 1 Telegram, 2 Pushover, 3 webhook, 4 Discord, 5 FCM.
      parameters:
      - description: Target
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateNotificationTarget.Request'
      produces:
      - application/json
      responses:
        "200":
          description: empty object
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid request, or an invalid target'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: User not authenticated'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to update notification target'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Set my notification target
      tags:
      - users
  /api/v1/users/tokens:
    get:
      description: Tokens are returned masked.
      produces:
      - application/json
      responses:
        "200":
          description: 'res: [{id, name, userId, maskedToken, createdAt}]'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 'error: User not authenticated'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to get user tokens'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: List my API tokens
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a long-lived API token for the secretkey header. The full
        token is only returned here. Users with MFA must include a valid mfaCode.
      parameters:
      - description: Token name and optional MFA code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CreateLongLivedToken.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'res: {id, name, userId, token, prefix, createdAt}, message
            (optional)'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: Invalid request | Invalid MFA code'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: User not authenticated'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to store the token'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Create an API token
      tags:
      - users
  /api/v1/users/tokens/{id}:
    delete:
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: empty object
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: User not authenticated'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to delete the token'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Delete an API token
      tags:
      - users
  /api/v1/users/webhook:
    put:
      consumes:
      - application/json
      description: 'Sets or clears (url: null) the URL that receives circle events.
        Circle admins with Plus only.'
      parameters:
      - description: Webhook URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.setWebhook.Request'
      produces:
      - application/json
      responses:
        "200":
          description: empty object
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid request, or an invalid URL'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: User not authenticated'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: This action is only available for Plus members | You
            are not an admin'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to set webhook URL'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Set the circle webhook
      tags:
      - users
  /eapi/v1/chore:
    get:
      description: Returns the active chores visible to the API token's user.
      parameters:
      - description: Include subtasks
        in: query
        name: includeSubtasks
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: chores
          schema:
            items:
              $ref: '#/definitions/model.Chore'
            type: array
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: List chores (external API)
      tags:
      - external-api
    post:
      consumes:
      - application/json
      description: Creates a one-time chore assigned to its creator. dueDate accepts
        RFC3339 or YYYY-MM-DD (the date-only form uses the current UTC time of day).
        createdBy must be a member of the circle.
      parameters:
      - description: Chore
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChoreLiteReq'
      produces:
      - application/json
      responses:
        "201":
          description: created chore
          schema:
            $ref: '#/definitions/model.Chore'
        "400":
          description: 'error: Invalid request body | Chore name is required | Invalid
            due date format | Specified user not found in circle | Specified project
            not found'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to get circle members | Error creating chore'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Create a chore (external API)
      tags:
      - external-api
  /eapi/v1/chore/{id}:
    delete:
      description: Only the chore creator or a circle admin/manager may delete it.
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Chore deleted successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid chore ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Only the chore creator or a circle admin/manager can
            delete this chore'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Chore not found'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to delete chore'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Delete a chore (external API)
      tags:
      - external-api
    put:
      consumes:
      - application/json
      description: Updates a chore's name, description and due date. Empty fields
        keep their current values; forceUnarchive restores an archived chore. Only
        the chore creator or a circle admin/manager may update it. Plus members only.
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChoreLiteReq'
      produces:
      - application/json
      responses:
        "200":
          description: updated chore
          schema:
            $ref: '#/definitions/model.Chore'
        "400":
          description: 'error: Invalid chore ID | Invalid request body | Invalid due
            date format'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Only the chore creator or a circle admin/manager can
            update this chore'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Chore not found'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Error updating chore'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Update a chore (external API)
      tags:
      - external-api
  /eapi/v1/chore/{id}/complete:
    post:
      description: Marks a chore done and schedules its next occurrence. completedBy
        credits another circle member; it must be assigned to the chore. Plus members
        only.
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID to credit (defaults to the token's user)
        in: query
        name: completedBy
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: updated chore
          schema:
            $ref: '#/definitions/model.Chore'
        "400":
          description: 'error: Invalid ID | User is not assigned to chore | Chore
            is out of completion window'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Error getting chore | Error completing chore | Error
            scheduling next due date'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Complete a chore (external API)
      tags:
      - external-api
  /eapi/v1/circle/members:
    get:
      description: Plus members only.
      produces:
      - application/json
      responses:
        "200":
          description: circle members
          schema:
            items:
              $ref: '#/definitions/circle.UserCircleDetail'
            type: array
        "404":
          description: 'error: No members found in the circle'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to get circle members'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: List circle members (external API)
      tags:
      - external-api
  /eapi/v1/things:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: things
          schema:
            items:
              $ref: '#/definitions/model.Thing'
            type: array
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: List things (external API)
      tags:
      - external-api
  /eapi/v1/things/{id}:
    get:
      parameters:
      - description: Thing ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: thing
          schema:
            additionalProperties:
              $ref: '#/definitions/model.Thing'
            type: object
        "400":
          description: 'error: Invalid thing id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Get a thing (external API)
      tags:
      - external-api
  /eapi/v1/things/{id}/state:
    get:
      description: Sets the state of one of the token user's things and runs any chore
        triggers. Uses GET so it can be called from simple webhooks.
      parameters:
      - description: Thing ID
        in: path
        name: id
        required: true
        type: integer
      - description: New state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: empty object
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid state value | Invalid state for thing | Invalid
            thing id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Set a thing's state (external API)
      tags:
      - external-api
  /eapi/v1/things/{id}/state/change:
    get:
      description: Adds op to a numeric thing's state, or sets it to set, then runs
        any chore triggers. Uses GET so it can be called from simple webhooks.
      parameters:
      - description: Thing ID
        in: path
        name: id
        required: true
        type: integer
      - description: Amount to add (negative to subtract)
        in: query
        name: op
        type: integer
      - description: Value to set
        in: query
        name: set
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'state: new state'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid increment value | Invalid state for thing |
            Invalid thing id'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: Change a thing's state (external API)
      tags:
      - external-api
  /health:
    get:
      description: Public, unauthenticated health check for containers and orchestrators.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: healthy, version, commit'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - resource
  /mcp:
    post:
      consumes:
      - application/json
      description: 'Model Context Protocol endpoint (JSON-RPC 2.0 over streamable
        HTTP) for AI assistants. Authenticate with an API token in the secretkey header
        or as Authorization: Bearer. Only available when MCP is enabled on the instance.
        GET and DELETE return 405.'
      parameters:
      - description: JSON-RPC 2.0 request
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: JSON-RPC 2.0 response
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 'error: API token required | Invalid API token | User account
            is disabled'
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: request too large
          schema:
            additionalProperties: true
            type: object
        "415":
          description: unsupported media type
          schema:
            additionalProperties: true
            type: object
      security:
      - APIKeyAuth: []
      summary: MCP endpoint
      tags:
      - mcp
  /webhooks/revenuecat:
    post:
      consumes:
      - application/json
      description: Receives RevenueCat in-app subscription events. The Authorization
        header must equal the configured RevenueCat secret. Called by RevenueCat,
        not by clients.
      parameters:
      - description: RevenueCat shared secret
        in: header
        name: Authorization
        required: true
        type: string
      - description: RevenueCat event
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: event processed
        "400":
          description: Invalid JSON
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "503":
          description: Webhook not configured
          schema:
            type: string
      summary: RevenueCat webhook
      tags:
      - webhooks
  /webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Receives Stripe subscription events. Only accepted from whitelisted
        Stripe IP addresses. Called by Stripe, not by clients.
      parameters:
      - description: Stripe event
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: event processed
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Stripe webhook
      tags:
      - webhooks
securityDefinitions:
  APIKeyAuth:
    description: donetick issued apikey
    in: header
    name: secretkey
    type: apiKey
  JWTKeyAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
