info:
  contact: {}
  description: Donetick swagger documentation.
  license:
    name: GNU Affero General Public License v3.0
    url: https://github.com/donetick/donetick/blob/main/LICENSE.md
  title: Donetick Swagger API
  version: "1.0"
paths:
  /api/v1/assets/{filepath}:
    get:
      description: Streams a stored file. Files outside profiles/ need a valid signed
        URL (expires and sig query parameters, from the signed URLs other endpoints
        return). No auth header is needed.
      parameters:
      - description: Stored file path
        in: path
        name: filepath
        required: true
        type: string
      - description: Signature expiry (Unix seconds)
        in: query
        name: expires
        type: integer
      - description: Signature
        in: query
        name: sig
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: file content
        "400":
          description: 'error: missing asset url | invalid url format | invalid asset
            path'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: invalid or expired signature for url'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: file not found'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download a stored file
      tags:
      - assets
  /api/v1/assets/chore:
    delete:
      consumes:
      - application/json
      description: Deletes a file uploaded as a draft that was never attached to a
        saved chore.
      parameters:
      - description: file_path
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 'message: draft file deleted'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: missing file_path'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: file is not a draft'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: draft file not found'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: failed to delete file | failed to remove file record'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      summary: Delete a draft upload
      tags:
      - assets
    post:
      consumes:
      - multipart/form-data
      description: Uploads an attachment or description image for a chore, or a draft
        for a chore that is still being created. For chore and chore_description,
        entityId is the chore ID and the user must be allowed to edit it. For the
        *_draft types, send draftId instead.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: What the file belongs to
        enum:
        - chore
        - chore_description
        - chore_attachment_draft
        - chore_description_draft
        in: formData
        name: entityType
        required: true
        type: string
      - description: Chore ID (chore, chore_description)
        in: formData
        name: entityId
        type: integer
      - description: Draft ID (*_draft types)
        in: formData
        name: draftId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: path, sign (signed URL), file_name, size_bytes
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: missing file | missing draftId | invalid entityType
            or entityId'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: user is not allowed to edit chore | user is not a plus
            member'
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: 'error: file size is too large'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: failed to save file | failed to save file record |
            failed to sign url'
          schema:
            additionalProperties:
              type: string
            type: object
        "507":
          description: 'error: no enough space'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      summary: Upload a chore file
      tags:
      - assets
  /api/v1/auth/:
    post:
      consumes:
      - application/json
      description: Creates a user with their own circle. Returns 403 when user creation
        or password auth is disabled on the instance.
      parameters:
      - description: New account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.signUp.SignUpReq'
      produces:
      - application/json
      responses:
        "201":
          description: empty object
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid request | Username can only contain lowercase
            letters (a-z), numbers (0-9), dots (.), and hyphens (-)'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: User creation is disabled | Password authentication
            is disabled on this instance'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Error creating user, email already exists or username
            is taken'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign up
      tags:
      - auth
  /api/v1/auth/{provider}/callback:
    post:
      consumes:
      - application/json
      description: 'Exchanges a provider credential for Donetick tokens, creating
        the account on first sign-in. The body depends on provider: google sends {token,
        provider}; apple sends {provider, data{provider, result{idToken, ...}}}; oauth2
        sends {code, redirect_uri, verifier}. Users with MFA get {mfaRequired: true,
        sessionToken} instead of tokens; finish with POST /api/v1/auth/mfa/verify.'
      parameters:
      - description: Identity provider
        enum:
        - google
        - apple
        - oauth2
        in: path
        name: provider
        required: true
        type: string
      - description: Provider credential (see description)
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: tokens (or mfaRequired + sessionToken)
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: 'error: Invalid request | Invalid token | Invalid Apple ID
            token | Authorization code is required'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Authentication failed | Unable to create user | Unable
            to Generate a Token'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign in with a third-party provider
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Logs in with username and password and returns access and refresh
        tokens (the refresh token is also set as an httpOnly cookie). Users with MFA
        get {mfaRequired: true, sessionToken} instead; finish with POST /api/v1/auth/mfa/verify.'
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.signIn'
      produces:
      - application/json
      responses:
        "200":
          description: tokens (or mfaRequired + sessionToken)
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: 'error: Invalid request'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Invalid credentials'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Password authentication is disabled on this instance'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Authentication failed | Failed to generate tokens'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /api/v1/auth/login/legacy:
    post:
      consumes:
      - application/json
      description: 'Legacy login handled by gin-jwt (the Authenticator configured
        here); returns an access token only. Prefer POST /api/v1/auth/login. Users
        with MFA get {mfaRequired: true, sessionToken} instead.'
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.signIn'
      produces:
      - application/json
      responses:
        "200":
          description: code, token, expire (or mfaRequired + sessionToken)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: code, message
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'error: Password authentication is disabled on this instance'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in (legacy)
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh token (cookie or body) and clears the cookie.
        Always succeeds.
      parameters:
      - description: Refresh token, if not sent as a cookie
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Logged out successfully'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out (revoke refresh token)
      tags:
      - auth
  /api/v1/auth/mfa/verify:
    post:
      consumes:
      - application/json
